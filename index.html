<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body { background: #001588; color: #fffbce; font-family: sans-serif; }
        .view { display: none; }
        .view.active { display: block; }
        .ok { background: #d4f5d8 !important; }
        .bad { background: #f8d0cc !important; }
    </style>
</head>
<body>
<!-- Окно авторизации -->
<div id="auth-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#001588; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fffbce; font-family:sans-serif; padding:20px; box-sizing:border-box;">
    <h2 style="font-size:24px; margin-bottom:20px;">Вход в Vocab</h2>
    <input type="email" id="auth-email" placeholder="Email" style="width:100%; max-width:300px; padding:12px; margin-bottom:10px; border-radius:8px; border:none; color:#000;">
    <input type="password" id="auth-password" placeholder="Пароль" style="width:100%; max-width:300px; padding:12px; margin-bottom:20px; border-radius:8px; border:none; color:#000;">
    <div style="display:flex; gap:10px; width:100%; max-width:300px;">
        <button id="btn-login" style="flex:1; padding:12px; background:#d4f5d8; color:#001588; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Войти</button>
        <button id="btn-signup" style="flex:1; padding:12px; background:transparent; color:#fffbce; border:2px solid #fffbce; border-radius:8px; font-weight:bold; cursor:pointer;">Регистрация</button>
    </div>
    <p id="auth-error" style="color:#f8d0cc; margin-top:15px; font-size:14px; text-align:center;"></p>
</div>

<!-- Основной интерфейс тренажера -->
<div class="p-4 max-w-md mx-auto">
    <div class="flex justify-between mb-6">
        <button onclick="setTab('cards')" class="px-4 py-2 rounded bg-blue-700">Карточки</button>
        <button onclick="setTab('listen')" class="px-4 py-2 rounded bg-blue-700">Аудирование</button>
    </div>

    <!-- Вкладка Карточки -->
    <div id="view-cards" class="view">
        <div id="card" onclick="flipCard()" class="h-48 flex items-center justify-center bg-yellow-100 text-blue-900 text-2xl font-bold rounded-xl shadow-lg p-4 text-center cursor-pointer mb-6 select-none">
            <span id="card-text">Нажмите Начать</span>
        </div>
        <div class="flex gap-4">
            <button onclick="nextCard()" class="flex-1 py-3 bg-green-200 text-blue-900 font-bold rounded-xl text-lg">Следующая</button>
        </div>
    </div>

    <!-- Вкладка Аудирование -->
    <div id="view-listen" class="view">
        <div class="bg-blue-800 p-6 rounded-xl shadow-lg text-center mb-6">
            <button id="lPlay" class="w-20 h-20 bg-yellow-100 rounded-full text-blue-900 text-3xl mx-auto mb-4 flex items-center justify-center">🔊</button>
            <input type="text" id="lIn" placeholder="Введите услышанное слово" class="w-full p-3 rounded-lg text-black text-center text-lg mb-4">
            <button id="lCheck" class="w-full py-3 bg-green-200 text-blue-900 font-bold rounded-xl text-lg">Проверить</button>
        </div>
    </div>
</div>

<img id="gromit" src="" style="display:none;">

<!-- Скрипты приложения -->
<script>
const KEY="vocab_words_v1";
const DEFAULTS=[
  {en:"amplify",ru:"усиливать"},{en:"reluctant",ru:"неохотный"},
  {en:"endeavor",ru:"стремление"},{en:"resilient",ru:"устойчивый"},
  {en:"concise",ru:"краткий"},{en:"profound",ru:"глубокий"}
];
let words = JSON.parse(localStorage.getItem(KEY)) || DEFAULTS;
let idx=0, flipped=false, tab="cards";

function speak(text){
  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

window.setTab = function(t){
  tab=t;
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  const viewEl = document.getElementById("view-"+t);
  if(viewEl) viewEl.classList.add("active");
  if(t==='listen') nextListen();
};

function flipCard(){
    flipped = !flipped;
    const w = words[idx];
    document.getElementById("card-text").textContent = flipped ? w.ru : w.en;
}
window.flipCard = flipCard;

function nextCard(){
    idx = (idx + 1) % words.length;
    flipped = false;
    document.getElementById("card-text").textContent = words[idx].en;
    speak(words[idx].en);
}
window.nextCard = nextCard;

let lCur=null;
function nextListen(){
  lCur = words[Math.floor(Math.random()*words.length)];
  const i=document.getElementById("lIn");
  if(i){ i.value=""; i.className="w-full p-3 rounded-lg text-black text-center text-lg mb-4"; }
}
window.nextListen = nextListen;

function initTrainer() {
  window.setTab("cards");
  if(words.length > 0) document.getElementById("card-text").textContent = words[idx].en;
}
window.initTrainer = initTrainer;
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBv7dzMXZWlAVo0ugN3JRjDtFib33URbPo",
  authDomain: "vocab-e1e70.firebaseapp.com",
  projectId: "vocab-e1e70",
  storageBucket: "vocab-e1e70.firebasestorage.app",
  messagingSenderId: "649460229924",
  appId: "1:649460229924:web:3025550edd36304bf575b1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.addEventListener('DOMContentLoaded', () => {
  const authScreen = document.getElementById('auth-screen');
  const emailInput = document.getElementById('auth-email');
  const passwordInput = document.getElementById('auth-password');
  const errorText = document.getElementById('auth-error');
  const loginBtn = document.getElementById('btn-login');
  const signupBtn = document.getElementById('btn-signup');

  onAuthStateChanged(auth, (user) => {
    if (user) {
      if(authScreen) authScreen.style.display = 'none';
      try { window.initTrainer(); } catch(e){}
    } else {
      if(authScreen) authScreen.style.display = 'flex';
    }
  });

  if(signupBtn) {
    signupBtn.onclick = () => {
      errorText.innerText = "Регистрация...";
      createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .catch((error) => { errorText.innerText = "Ошибка: " + error.message; });
    };
  }

  if(loginBtn) {
    loginBtn.onclick = () => {
      errorText.innerText = "Вход...";
      signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .catch((error) => { errorText.innerText = "Ошибка: " + error.message; });
    };
  }

  const playBtn = document.getElementById("lPlay");
  if(playBtn) playBtn.onclick=()=>{if(lCur) speak(lCur.en);};

  const checkBtn = document.getElementById("lCheck");
  if(checkBtn) {
    checkBtn.onclick=()=>{
      const i=document.getElementById("lIn");
      if(i && lCur) {
        if(i.value.trim().toLowerCase() === lCur.en.toLowerCase()) {
            i.classList.add("ok");
            setTimeout(nextListen, 1000);
        } else {
            i.classList.add("bad");
        }
      }
    };
  }
});
</script>
</body>
</html>
