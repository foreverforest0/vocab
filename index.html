<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>vocab — English trainer</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#001588; --card:#fffbce; }
  html,body{background:var(--bg);color:var(--card);font-family:Inter,system-ui,sans-serif;margin:0;}
  .serif{font-family:'DM Serif Display',serif}
  .tabnum{font-variant-numeric:tabular-nums}
  input,textarea{outline:none}
  .ok{background:#d4f5d8 !important;border-color:#1f9d55 !important;}
  .bad{background:#f8d0cc !important;border-color:#b3261e !important;}
  #auth-screen input{width:100%;max-width:300px;padding:12px;border-radius:8px;border:none;color:#000;font-family:inherit;font-size:15px;}
  .spinner{width:18px;height:18px;border:3px solid rgba(255,251,206,.3);border-top-color:var(--card);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;">
  <h2 style="font-size:26px;margin-bottom:6px;font-family:'DM Serif Display',serif;">vocab</h2>
  <p style="font-size:13px;opacity:.6;margin-bottom:28px;">English trainer</p>
  <input type="email" id="auth-email" placeholder="Email" style="margin-bottom:10px;">
  <input type="password" id="auth-password" placeholder="Password" style="margin-bottom:20px;">
  <div style="display:flex;gap:10px;width:100%;max-width:300px;">
    <button id="btn-login" style="flex:1;padding:12px;background:var(--card);color:var(--bg);border:none;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px;">Sign in</button>
    <button id="btn-signup" style="flex:1;padding:12px;background:transparent;color:var(--card);border:2px solid var(--card);border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px;">Sign up</button>
  </div>
  <p id="auth-error" style="color:#f8d0cc;margin-top:16px;font-size:13px;text-align:center;min-height:20px;"></p>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;">
<div class="mx-auto max-w-6xl px-6 py-10">
  <header class="flex items-end justify-between flex-wrap gap-4">
    <h1 class="serif text-5xl font-bold">vocab</h1>
    <div class="text-right text-sm opacity-80">
      <div>English trainer</div>
      <div><span id="count">0</span> words</div>
      <button id="btn-logout" style="font-size:11px;opacity:.5;background:none;border:none;color:var(--card);cursor:pointer;margin-top:2px;">sign out</button>
    </div>
  </header>

  <nav class="mt-8 flex flex-wrap gap-2" id="tabs">
    <button data-tab="cards" class="tab px-5 py-2 rounded-full text-sm font-medium border">Cards</button>
    <button data-tab="write" class="tab px-5 py-2 rounded-full text-sm font-medium border">Write</button>
    <button data-tab="listen" class="tab px-5 py-2 rounded-full text-sm font-medium border">Listen</button>
  </nav>

  <main class="mt-8">
    <!-- CARDS -->
    <section id="view-cards" class="view grid gap-8 lg:grid-cols-[1fr_18rem]">
      <div>
        <div id="card" onclick="flipCard()" class="relative rounded-3xl p-10 min-h-[280px] flex flex-col justify-center cursor-pointer select-none shadow-xl" style="background:var(--card);color:var(--bg)">
          <div class="flex items-center justify-between text-xs uppercase tracking-widest opacity-70">
            <span id="cardIdx">01 / 0</span>
            <span id="cardSide">word</span>
          </div>
          <div id="cardText" class="mt-6 serif text-5xl font-bold break-words">—</div>
          <div class="mt-6 flex items-center justify-between">
            <button id="btnSpeak" class="text-sm px-3 py-1.5 rounded-full border" style="border-color:var(--bg);color:var(--bg)">🔊 listen</button>
            <span class="text-xs opacity-60">tap to flip</span>
          </div>
        </div>
        <div class="mt-4 flex gap-2">
          <button id="btnPrev" class="flex-1 rounded-2xl py-3 font-medium" style="background:var(--card);color:var(--bg)">← Prev</button>
          <button id="btnShuf" class="rounded-2xl px-6 py-3 font-medium" style="background:var(--card);color:var(--bg)">⇄</button>
          <button id="btnNext" class="flex-1 rounded-2xl py-3 font-medium" style="background:var(--card);color:var(--bg)">Next →</button>
        </div>

        <!-- word manager -->
        <div class="mt-10 rounded-3xl p-6" style="background:var(--card);color:var(--bg)">
          <div class="flex items-center justify-between flex-wrap gap-3">
            <h3 class="serif text-2xl font-bold">Your words</h3>
            <div class="flex gap-2 text-xs" id="modeBox">
              <button data-mode="manual" class="mode px-3 py-1.5 rounded-full border" style="border-color:var(--bg)">My translation</button>
              <button data-mode="auto" class="mode px-3 py-1.5 rounded-full border" style="border-color:var(--bg)">Auto translate</button>
            </div>
          </div>
          <textarea id="ta" placeholder="word перевод&#10;book книга" class="mt-4 w-full rounded-xl p-3 text-sm min-h-24 bg-transparent border" style="border-color:var(--bg);color:var(--bg)"></textarea>
          <button id="btnAdd" class="mt-3 rounded-full px-5 py-2 text-sm font-medium" style="background:var(--bg);color:var(--card)">Add words</button>
          <div id="syncStatus" class="text-xs opacity-50 mt-2"></div>
          <ul id="list" class="mt-5 grid sm:grid-cols-2 gap-2"></ul>
        </div>
      </div>

      <!-- SIDEBAR -->
      <aside class="flex flex-col items-center gap-4">
        <img id="gromitImg" alt="Gromit" class="w-56 h-auto drop-shadow-2xl rounded-2xl" />
        <div class="w-full rounded-3xl p-6 text-center" style="background:var(--card);color:var(--bg)">
          <div class="text-xs uppercase tracking-widest opacity-70">Speaking timer</div>
          <div id="timer" class="serif text-5xl font-bold mt-2 tabnum">01:00</div>
          <div class="mt-4 pt-4 border-t" style="border-color:rgba(0,21,136,0.2)">
            <div class="text-xs uppercase tracking-widest opacity-70">Speak about</div>
            <div id="timerWord" class="serif text-3xl font-bold mt-1">—</div>
            <div id="timerTr" class="text-sm opacity-70 mt-1">—</div>
            <button id="btnTimerWord" class="mt-3 text-xs underline opacity-70 hover:opacity-100">↻ new word</button>
          </div>
          <div class="mt-4 flex gap-2">
            <button id="btnTimer" class="flex-1 rounded-full py-2 text-sm font-medium border" style="border-color:var(--bg)">Start</button>
            <button id="btnReset" class="flex-1 rounded-full py-2 text-sm font-medium border" style="border-color:var(--bg)">Reset</button>
          </div>
        </div>
      </aside>
    </section>

    <!-- WRITE -->
    <section id="view-write" class="view hidden">
      <div class="rounded-3xl p-8" style="background:var(--card);color:var(--bg)">
        <h3 class="serif text-3xl font-bold">Write the English word</h3>
        <div class="mt-6">
          <div class="text-sm opacity-70">Translate:</div>
          <div id="wRu" class="serif text-4xl font-bold mt-1">—</div>
          <input id="wIn" placeholder="type here…" class="mt-5 w-full rounded-xl px-4 py-3 bg-transparent border text-lg" style="border-color:var(--bg);color:var(--bg)" />
          <div id="wFb" class="mt-3 text-sm font-medium h-5"></div>
          <div class="mt-5 flex gap-2">
            <button id="wCheck" class="rounded-full px-5 py-2 text-sm font-medium" style="background:var(--bg);color:var(--card)">Check</button>
            <button id="wNext" class="rounded-full px-5 py-2 text-sm font-medium border" style="border-color:var(--bg)">Next</button>
          </div>
        </div>
      </div>
    </section>

    <!-- LISTEN -->
    <section id="view-listen" class="view hidden">
      <div class="rounded-3xl p-8" style="background:var(--card);color:var(--bg)">
        <h3 class="serif text-3xl font-bold">Listen & write</h3>
        <div class="mt-6">
          <button id="lPlay" class="rounded-full px-6 py-3 text-base font-medium" style="background:var(--bg);color:var(--card)">🔊 Play word</button>
          <input id="lIn" placeholder="what did you hear?" class="mt-5 w-full rounded-xl px-4 py-3 bg-transparent border text-lg" style="border-color:var(--bg);color:var(--bg)" />
          <div id="lFb" class="mt-3 text-sm font-medium h-5"></div>
          <div class="mt-5 flex gap-2">
            <button id="lCheck" class="rounded-full px-5 py-2 text-sm font-medium" style="background:var(--bg);color:var(--card)">Check</button>
            <button id="lNext" class="rounded-full px-5 py-2 text-sm font-medium border" style="border-color:var(--bg)">Next</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="mt-16 text-center text-xs opacity-60">vocab · v2.0</footer>
</div>
</div>

// ---- Google TTS speak ----
function speak(text){
  const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en&client=tw-ob`;
  const audio = new Audio(url);
  audio.play().catch(()=>{
    // fallback to browser TTS
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    const v = speechSynthesis.getVoices().find(x=>x.lang==="en-US"&&x.name.includes("Google"));
    if(v) u.voice=v;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  });
}

// ---- tabs ----
window.setTab = function setTab(t){
  tab=t;
  document.querySelectorAll(".view").forEach(v=>v.classList.add("hidden"));
  document.getElementById("view-"+t).classList.remove("hidden");
  document.querySelectorAll(".tab").forEach(b=>{
    const on=b.dataset.tab===t;
    b.style.background=on?CARD:"transparent";
    b.style.color=on?BG:CARD;
    b.style.borderColor=CARD;
  });
  if(t==="write") nextWrite();
  if(t==="listen") nextListen();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

// ---- cards ----
window.renderCard = function renderCard(){
  document.getElementById("count").textContent=words.length;
  const w=words[idx];
  if(!w){document.getElementById("cardText").textContent="Add words below";return;}
  document.getElementById("cardIdx").textContent=String(idx+1).padStart(2,"0")+" / "+words.length;
  document.getElementById("cardSide").textContent=flipped?"translation":"word";
  document.getElementById("cardText").textContent=flipped?w.ru:w.en;
}
window.flipCard=function(){flipped=!flipped;renderCard();};
document.getElementById("btnSpeak").onclick=e=>{e.stopPropagation();if(words[idx])speak(words[idx].en);};
document.getElementById("btnPrev").onclick=()=>{idx=(idx-1+words.length)%words.length;flipped=false;renderCard();};
document.getElementById("btnNext").onclick=()=>{idx=(idx+1)%words.length;flipped=false;renderCard();};
document.getElementById("btnShuf").onclick=()=>{if(words.length<2)return;let n=Math.floor(Math.random()*words.length);if(n===idx)n=(n+1)%words.length;idx=n;flipped=false;renderCard();};

// ---- word list UI ----
window.renderList = function renderList(){
  const ul=document.getElementById("list");ul.innerHTML="";
  words.forEach(w=>{
    const li=document.createElement("li");
    li.className="flex items-center justify-between rounded-xl px-3 py-2 border";
    li.style.borderColor=BG;
    li.innerHTML=`<span class="text-sm"><b>${w.en}</b> · ${w.ru}</span><button class="text-xs opacity-70 hover:opacity-100 ml-2">✕</button>`;
    li.querySelector("button").onclick=()=>window.deleteWord(w.id);
    ul.appendChild(li);
  });
}

// ---- Firestore sync ----
window.loadWords = async function loadWords(){
  const db = window.__firestoreDb;
  const currentUser = window.currentUser;
  if(!db||!currentUser) return;
  const {collection,getDocs}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const snap=await getDocs(collection(db,"users",currentUser.uid,"words"));
  if(snap.empty){
    // first login: seed defaults
    words=[...DEFAULTS];
    await saveAllWords();
  } else {
    words=snap.docs.map(d=>({id:d.id,...d.data()}));
  }
  idx=0;flipped=false;
  renderCard();renderList();pickTimerWord();
}

window.saveWord = async function saveWord(w){
  const db = window.__firestoreDb;
  const currentUser = window.currentUser;
  if(!db||!currentUser) return;
  setSyncStatus("saving…");
  const {doc,setDoc}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  await setDoc(doc(db,"users",currentUser.uid,"words",w.id),{en:w.en,ru:w.ru});
  setSyncStatus("✓ synced");
  setTimeout(()=>setSyncStatus(""),2000);
}

window.deleteWord = async function deleteWord(id){
  const db = window.__firestoreDb;
  const currentUser = window.currentUser;
  words=words.filter(w=>w.id!==id);
  if(idx>=words.length)idx=Math.max(0,words.length-1);
  renderCard();renderList();
  if(!db||!currentUser) return;
  const {doc,deleteDoc}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  await deleteDoc(doc(db,"users",currentUser.uid,"words",id));
}

window.saveAllWords = async function saveAllWords(){
  const db = window.__firestoreDb;
  const currentUser = window.currentUser;
  if(!db||!currentUser) return;
  for(const w of words) await saveWord(w);
}

function setSyncStatus(msg){document.getElementById("syncStatus").textContent=msg;}

// ---- add words ----
const AUTO={"привет":"hello","мир":"world","книга":"book","собака":"dog","кошка":"cat","дом":"house","вода":"water","хлеб":"bread","друг":"friend","любовь":"love","время":"time","день":"day","ночь":"night","солнце":"sun","луна":"moon"};
function autoTr(s){s=s.toLowerCase().trim();if(/[а-яё]/i.test(s))return AUTO[s]||s;const e=Object.entries(AUTO).find(([,v])=>v===s);return e?e[0]:"?"+s;}

window.setMode = function setMode(m){mode=m;document.querySelectorAll(".mode").forEach(b=>{const on=b.dataset.mode===m;b.style.background=on?BG:"transparent";b.style.color=on?CARD:BG;});}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

document.getElementById("btnAdd").onclick=async()=>{
  const lines=document.getElementById("ta").value.split("\n").map(s=>s.trim()).filter(Boolean);
  for(const line of lines){
    const parts=line.split(/\s+/);
    let w;
    if(mode==="auto"){w={id:crypto.randomUUID(),en:parts.join(" "),ru:autoTr(parts.join(" "))};}
    else{if(parts.length<2)continue;w={id:crypto.randomUUID(),en:parts[0],ru:parts.slice(1).join(" ")};}
    words.push(w);
    await saveWord(w);
  }
  document.getElementById("ta").value="";
  renderCard();renderList();
};

// ---- timer ----
let left=60,running=false,tid=null;
window.renderTimer = function renderTimer(){const m=String(Math.floor(left/60)).padStart(2,"0"),s=String(left%60).padStart(2,"0");document.getElementById("timer").textContent=m+":"+s;document.getElementById("btnTimer").textContent=running?"Pause":"Start";}
window.pickTimerWord = function pickTimerWord(){const el=document.getElementById("timerWord"),tr=document.getElementById("timerTr");if(!words.length){el.textContent="—";tr.textContent="add words";return;}const w=words[Math.floor(Math.random()*words.length)];el.textContent=w.en;tr.textContent=w.ru;}
document.getElementById("btnTimerWord").onclick=pickTimerWord;
document.getElementById("btnTimer").onclick=()=>{running=!running;if(running){pickTimerWord();tid=setInterval(()=>{left--;if(left<=0){left=0;running=false;clearInterval(tid);}renderTimer();},1000);}else{clearInterval(tid);}renderTimer();};
document.getElementById("btnReset").onclick=()=>{clearInterval(tid);running=false;left=60;renderTimer();pickTimerWord();};

// ---- games ----
function pick(){return words[Math.floor(Math.random()*words.length)];}
function fb(el,ok){el.textContent=ok?"✓ Correct!":"✗ Try again";el.style.color=ok?"#0a7d2f":"#b3261e";}

let wCur=null;
function nextWrite(){wCur=pick();document.getElementById("wRu").textContent=wCur?wCur.ru:"Add words first";const i=document.getElementById("wIn");i.value="";i.classList.remove("ok","bad");document.getElementById("wFb").textContent="";}
document.getElementById("wCheck").onclick=()=>{if(!wCur)return;const i=document.getElementById("wIn");const ok=i.value.trim().toLowerCase()===wCur.en.toLowerCase();i.classList.remove("ok","bad");i.classList.add(ok?"ok":"bad");fb(document.getElementById("wFb"),ok);};
document.getElementById("wNext").onclick=nextWrite;
document.getElementById("wIn").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("wCheck").click();});

let lCur=null;
function nextListen(){lCur=pick();const i=document.getElementById("lIn");i.value="";i.classList.remove("ok","bad");document.getElementById("lFb").textContent="";if(lCur)speak(lCur.en);}
document.getElementById("lPlay").onclick=()=>{if(lCur)speak(lCur.en);};
document.getElementById("lCheck").onclick=()=>{if(!lCur)return;const i=document.getElementById("lIn");const ok=i.value.trim().toLowerCase()===lCur.en.toLowerCase();i.classList.remove("ok","bad");i.classList.add(ok?"ok":"bad");fb(document.getElementById("lFb"),ok);};
document.getElementById("lNext").onclick=nextListen;
document.getElementById("lIn").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("lCheck").click();});

// ---- logout ----
document.getElementById("btn-logout").onclick=async()=>{
  const {getAuth,signOut}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
  signOut(getAuth());
};
</script>
